name: xyz.openbmc_project.Provisioning
description: >
  Interface to represent the provisioning status of the BMC.
  Provides a property to indicate whether the BMC is provisioned,
  and methods to initiate provisioning and check the peer BMC connection.

properties:
  - name: ProvisioningState
    type: b
    flags:
      - readonly
    default: false
    description: >
      True means the BMC is in a provisioned state.

  # - name: PendingClearProvision
  #   type: b
  #   flags:
  #     - readonly
  #   description: >
  #     True means a clear provision action is pending.
  #     (Commented out as discussion is ongoing about whether this property is still needed.)

methods:
  - name: StartProvisioning
    description: >
      Starts the provisioning process and updates the ProvisioningState accordingly.
    arguments: []

  - name: CheckPeerBMCConnection
    description: >
      Performs a check to determine if the peer BMC is reachable and available for provisioning.
    arguments: []
    returns:
      - type: b
        description: >
          True if the peer BMC is reachable; false otherwise.

